<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TownsSquare — Coming Soon</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        height: 100%;
        font-family: "Consolas", "Courier New", monospace;
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #0d1f0d 0%, #1a2e1a 40%, #0f1f15 100%);
        color: #e0e8d8;
        position: relative;
      }

      /* Branches at bottom */
      .branches {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 250px;
        z-index: 1;
        pointer-events: none;
        opacity: 0.15;
      }

      .branches svg {
        width: 100%;
        height: 100%;
      }

      .branch {
        fill: none;
        stroke: #3a6a2a;
        stroke-width: 3;
        stroke-linecap: round;
        transform-origin: bottom center;
        animation: sway 5s ease-in-out infinite alternate;
      }

      .branch:nth-child(2) { animation-delay: 1s; animation-duration: 6s; }
      .branch:nth-child(3) { animation-delay: 2s; animation-duration: 4.5s; }
      .branch:nth-child(4) { animation-delay: 0.5s; animation-duration: 7s; }

      @keyframes sway {
        from { transform: rotate(-2deg); }
        to { transform: rotate(2deg); }
      }

      /* Floating leaves with wind */
      .leaves {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 1;
        overflow: hidden;
      }

      .leaf {
        position: absolute;
        width: 40px;
        height: 40px;
        opacity: 0.15;
        animation: drift 12s linear infinite;
      }

      .leaf-inner {
        width: 100%;
        height: 100%;
        animation: wind 2s ease-in-out infinite alternate;
      }

      .leaf:nth-child(1) { left: 5%;  animation-delay: 0s;  animation-duration: 14s; }
      .leaf:nth-child(2) { left: 18%; animation-delay: 2s;  animation-duration: 16s; }
      .leaf:nth-child(3) { left: 32%; animation-delay: 4s;  animation-duration: 11s; }
      .leaf:nth-child(4) { left: 45%; animation-delay: 1s;  animation-duration: 15s; }
      .leaf:nth-child(5) { left: 58%; animation-delay: 3s;  animation-duration: 12s; }
      .leaf:nth-child(6) { left: 72%; animation-delay: 5s;  animation-duration: 17s; }
      .leaf:nth-child(7) { left: 88%; animation-delay: 6s;  animation-duration: 13s; }
      .leaf:nth-child(8) { left: 50%; animation-delay: 7s;  animation-duration: 18s; }
      .leaf:nth-child(9) { left: 25%; animation-delay: 8s;  animation-duration: 14s; }
      .leaf:nth-child(10) { left: 65%; animation-delay: 9s;  animation-duration: 15s; }

      .leaf-inner svg {
        width: 100%;
        height: 100%;
        fill: #4a7c3a;
      }

      @keyframes drift {
        0% {
          top: 110%;
        }
        100% {
          top: -10%;
        }
      }

      @keyframes wind {
        0% { transform: translateX(-25px) rotate(-20deg); }
        100% { transform: translateX(25px) rotate(20deg); }
      }

      .leaf:nth-child(2) .leaf-inner { animation-duration: 3s; }
      .leaf:nth-child(4) .leaf-inner { animation-duration: 1.5s; }
      .leaf:nth-child(6) .leaf-inner { animation-duration: 2.5s; }
      .leaf:nth-child(8) .leaf-inner { animation-duration: 3.5s; }
      .leaf:nth-child(10) .leaf-inner { animation-duration: 2s; }

      /* Connection lines (community/network) */
      .connections {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.08;
      }

      .connections svg {
        width: 100%;
        height: 100%;
      }

      .connections line {
        stroke: #5a9e4a;
        stroke-width: 1;
        animation: pulse-line 4s ease-in-out infinite;
      }

      @keyframes pulse-line {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 1; }
      }

      /* Main content */
      .container {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 2rem;
        max-width: 600px;
      }

      .logo {
        margin-bottom: 2rem;
        opacity: 0;
        animation: fadeIn 1.2s ease-out 0.3s forwards;
      }

      .logo-circle {
        width: 80px;
        height: 80px;
        margin: 0 auto;
        border-radius: 50%;
        border: 2px solid #4a7c3a;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: breathe 4s ease-in-out infinite;
      }

      .logo-circle svg {
        width: 44px;
        height: 44px;
        fill: none;
        stroke: #4a7c3a;
        stroke-width: 1.5;
        stroke-linejoin: round;
      }

      @keyframes breathe {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(74, 124, 58, 0.2);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 20px 4px rgba(74, 124, 58, 0.15);
        }
      }

      .title {
        font-size: clamp(1.5rem, 5vw, 2.2rem);
        font-weight: normal;
        letter-spacing: 0.05em;
        color: #c8d8b8;
        opacity: 0;
        animation: fadeIn 1.2s ease-out 0.6s forwards;
      }

      .subtitle {
        margin-top: 0.75rem;
        font-size: 0.875rem;
        color: #6a7e5a;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0;
        animation: fadeIn 1.2s ease-out 0.9s forwards;
      }

      .coming-soon {
        display: inline-block;
        margin-top: 2.5rem;
        font-size: clamp(1.2rem, 4vw, 1.6rem);
        color: #8ab96a;
        letter-spacing: 0.08em;
        white-space: nowrap;
        overflow: hidden;
        border-right: 2px solid #8ab96a;
        width: 0;
        opacity: 0;
        animation: fadeIn 0.1s ease-out 1.2s forwards,
                   type 2s steps(14, end) 1.3s forwards,
                   blink 0.8s step-end infinite;
      }

      @keyframes type {
        from { width: 0; }
        to { width: 14ch; }
      }

      @keyframes blink {
        50% { border-color: transparent; }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(15px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .footer {
        margin-top: 3rem;
        font-size: 0.7rem;
        color: #3a5a2a;
        letter-spacing: 0.05em;
        opacity: 0;
        animation: fadeIn 1.2s ease-out 2s forwards;
      }
    </style>
  </head>
  <body>
    <!-- Branches at bottom -->
    <div class="branches">
      <svg viewBox="0 0 1920 250" preserveAspectRatio="none">
        <path class="branch" d="M 200 250 L 200 180 L 160 140 L 140 110" />
        <path class="branch" d="M 200 250 L 200 180 L 240 140 L 270 100" />
        <path class="branch" d="M 960 250 L 960 160 L 920 120 L 900 80" />
        <path class="branch" d="M 960 250 L 960 160 L 1000 120 L 1030 70" />
        <path class="branch" d="M 1700 250 L 1700 190 L 1660 150 L 1640 110" />
        <path class="branch" d="M 1700 250 L 1700 190 L 1740 150 L 1770 100" />
      </svg>
    </div>

    <!-- Floating leaves with wind -->
    <div class="leaves">
      <div class="leaf"><div class="leaf-inner"><svg viewBox="0 0 24 24"><path d="M12 2 C8 6 6 12 12 22 C18 12 16 6 12 2 Z M12 2 L12 22"/></svg></div></div>
      <div class="leaf"><div class="leaf-inner"><svg viewBox="0 0 24 24"><path d="M12 2 C8 6 6 12 12 22 C18 12 16 6 12 2 Z M12 2 L12 22"/></svg></div></div>
      <div class="leaf"><div class="leaf-inner"><svg viewBox="0 0 24 24"><path d="M12 2 C8 6 6 12 12 22 C18 12 16 6 12 2 Z M12 2 L12 22"/></svg></div></div>
      <div class="leaf"><div class="leaf-inner"><svg viewBox="0 0 24 24"><path d="M12 2 C8 6 6 12 12 22 C18 12 16 6 12 2 Z M12 2 L12 22"/></svg></div></div>
      <div class="leaf"><div class="leaf-inner"><svg viewBox="0 0 24 24"><path d="M12 2 C8 6 6 12 12 22 C18 12 16 6 12 2 Z M12 2 L12 22"/></svg></div></div>
      <div class="leaf"><div class="leaf-inner"><svg viewBox="0 0 24 24"><path d="M12 2 C8 6 6 12 12 22 C18 12 16 6 12 2 Z M12 2 L12 22"/></svg></div></div>
      <div class="leaf"><div class="leaf-inner"><svg viewBox="0 0 24 24"><path d="M12 2 C8 6 6 12 12 22 C18 12 16 6 12 2 Z M12 2 L12 22"/></svg></div></div>
      <div class="leaf"><div class="leaf-inner"><svg viewBox="0 0 24 24"><path d="M12 2 C8 6 6 12 12 22 C18 12 16 6 12 2 Z M12 2 L12 22"/></svg></div></div>
      <div class="leaf"><div class="leaf-inner"><svg viewBox="0 0 24 24"><path d="M12 2 C8 6 6 12 12 22 C18 12 16 6 12 2 Z M12 2 L12 22"/></svg></div></div>
      <div class="leaf"><div class="leaf-inner"><svg viewBox="0 0 24 24"><path d="M12 2 C8 6 6 12 12 22 C18 12 16 6 12 2 Z M12 2 L12 22"/></svg></div></div>
    </div>

    <!-- Connection lines (community network) -->
    <div class="connections">
      <svg viewBox="0 0 1920 1080" preserveAspectRatio="none">
        <line x1="200" y1="200" x2="600" y2="400" />
        <line x1="600" y1="400" x2="1000" y2="300" />
        <line x1="1000" y1="300" x2="1400" y2="500" />
        <line x1="1400" y1="500" x2="1700" y2="200" />
        <line x1="600" y1="400" x2="800" y2="700" />
        <line x1="800" y1="700" x2="1200" y2="800" />
        <line x1="1200" y1="800" x2="1400" y2="500" />
        <line x1="200" y1="200" x2="800" y2="700" />
      </svg>
    </div>

    <!-- Main content -->
    <div class="container">
      <div class="logo">
        <div class="logo-circle">
          <svg viewBox="0 0 24 24">
            <!-- 16-edge polygon (hexadecagon) -->
            <polygon points="22,12 21.24,15.83 19.07,19.07 15.83,21.24 12,22 8.17,21.24 4.93,19.07 2.76,15.83 2,12 2.76,8.17 4.93,4.93 8.17,2.76 12,2 15.83,2.76 19.07,4.93 21.24,8.17" />
            <!-- Inner connecting lines (community) -->
            <line x1="22" y1="12" x2="2" y2="12" />
            <line x1="12" y1="2" x2="12" y2="22" />
            <line x1="19.07" y1="4.93" x2="4.93" y2="19.07" />
            <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
            <!-- Center node -->
            <circle cx="12" cy="12" r="1.5" fill="#4a7c3a" stroke="none" />
          </svg>
        </div>
      </div>

      <h1 class="title">TownsSquare</h1>
      <p class="subtitle">Community &middot; Nature &middot; Collaboration</p>
      <p class="coming-soon">Coming Soon</p>
      <p class="footer">growing roots, building together</p>
    </div>
  </body>
</html>
